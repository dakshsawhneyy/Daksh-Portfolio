apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-deployment
  namespace: daksh-portfolio
  labels:
    app: frontend
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: daksh-portfolio-frontend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort | default 5173 }}
        # No VITE_BACKEND_URL here: Vite inlines env at BUILD time, so a runtime
        # env var is ignored. The app calls same-origin /api/*, which the ingress
        # routes to daksh-portfolio-backend-service.